<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="1" y="1" width="898" height="268" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text x="450" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#58a6ff">Data → Model → Insight</text>
  <text x="450" y="76" text-anchor="middle" font-size="13" fill="#8b949e">AI &amp; Data Science · from messy data to decisions</text>

  <!-- node boxes -->
  <g fill="#161b22" stroke="#30363d">
    <rect x="50" y="95" width="140" height="115" rx="12"/>
    <rect x="270" y="95" width="140" height="115" rx="12"/>
    <rect x="490" y="95" width="140" height="115" rx="12"/>
    <rect x="710" y="95" width="140" height="115" rx="12"/>
  </g>

  <!-- 1. Raw data: flickering scattered points -->
  <g fill="#f85149">
    <circle cx="85" cy="120" r="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="148" r="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="115" r="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="165" r="4"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="152" cy="150" r="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="126" cy="172" r="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="165" cy="126" r="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 2. Cleaning: rows turn red to green -->
  <rect x="300" y="112" width="80" height="8" rx="4" fill="#f85149"><animate attributeName="fill" values="#f85149;#f85149;#3fb950;#3fb950;#f85149" keyTimes="0;0.1;0.3;0.9;1" dur="4s" repeatCount="indefinite"/></rect>
  <rect x="300" y="130" width="80" height="8" rx="4" fill="#f85149"><animate attributeName="fill" values="#f85149;#f85149;#3fb950;#3fb950;#f85149" keyTimes="0;0.2;0.4;0.9;1" dur="4s" repeatCount="indefinite"/></rect>
  <rect x="300" y="148" width="80" height="8" rx="4" fill="#f85149"><animate attributeName="fill" values="#f85149;#f85149;#3fb950;#3fb950;#f85149" keyTimes="0;0.3;0.5;0.9;1" dur="4s" repeatCount="indefinite"/></rect>
  <rect x="300" y="166" width="80" height="8" rx="4" fill="#f85149"><animate attributeName="fill" values="#f85149;#f85149;#3fb950;#3fb950;#f85149" keyTimes="0;0.4;0.6;0.9;1" dur="4s" repeatCount="indefinite"/></rect>

  <!-- 3. Model: small neural network -->
  <g stroke="#58a6ff" stroke-width="1">
    <g opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="2s" repeatCount="indefinite"/>
      <line x1="530" y1="120" x2="560" y2="120"/><line x1="530" y1="120" x2="560" y2="145"/><line x1="530" y1="120" x2="560" y2="170"/>
      <line x1="530" y1="145" x2="560" y2="120"/><line x1="530" y1="145" x2="560" y2="145"/><line x1="530" y1="145" x2="560" y2="170"/>
      <line x1="530" y1="170" x2="560" y2="120"/><line x1="530" y1="170" x2="560" y2="145"/><line x1="530" y1="170" x2="560" y2="170"/>
    </g>
    <g opacity="0.35">
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="2s" begin="1s" repeatCount="indefinite"/>
      <line x1="560" y1="120" x2="590" y2="132"/><line x1="560" y1="120" x2="590" y2="158"/>
      <line x1="560" y1="145" x2="590" y2="132"/><line x1="560" y1="145" x2="590" y2="158"/>
      <line x1="560" y1="170" x2="590" y2="132"/><line x1="560" y1="170" x2="590" y2="158"/>
    </g>
  </g>
  <g fill="#58a6ff">
    <circle cx="530" cy="120" r="5"/><circle cx="530" cy="145" r="5"/><circle cx="530" cy="170" r="5"/>
    <circle cx="560" cy="120" r="5"><animate attributeName="r" values="4;7;4" dur="2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="145" r="5"><animate attributeName="r" values="4;7;4" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="170" r="5"><animate attributeName="r" values="4;7;4" dur="2s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#3fb950">
    <circle cx="590" cy="132" r="5"><animate attributeName="r" values="4;7;4" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="158" r="5"><animate attributeName="r" values="4;7;4" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 4. Insights: growing bars -->
  <g fill="#3fb950">
    <rect x="745" width="14" rx="2" y="175" height="0"><animate attributeName="height" values="0;35;35;0" keyTimes="0;0.35;0.9;1" dur="3.5s" repeatCount="indefinite"/><animate attributeName="y" values="175;140;140;175" keyTimes="0;0.35;0.9;1" dur="3.5s" repeatCount="indefinite"/></rect>
    <rect x="767" width="14" rx="2" y="175" height="0"><animate attributeName="height" values="0;55;55;0" keyTimes="0;0.45;0.9;1" dur="3.5s" repeatCount="indefinite"/><animate attributeName="y" values="175;120;120;175" keyTimes="0;0.45;0.9;1" dur="3.5s" repeatCount="indefinite"/></rect>
    <rect x="789" width="14" rx="2" y="175" height="0"><animate attributeName="height" values="0;42;42;0" keyTimes="0;0.55;0.9;1" dur="3.5s" repeatCount="indefinite"/><animate attributeName="y" values="175;133;133;175" keyTimes="0;0.55;0.9;1" dur="3.5s" repeatCount="indefinite"/></rect>
    <rect x="811" width="14" rx="2" y="175" height="0"><animate attributeName="height" values="0;68;68;0" keyTimes="0;0.65;0.9;1" dur="3.5s" repeatCount="indefinite"/><animate attributeName="y" values="175;107;107;175" keyTimes="0;0.65;0.9;1" dur="3.5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- labels -->
  <g fill="#c9d1d9" font-size="14" font-weight="600" text-anchor="middle">
    <text x="120" y="199">Raw Data</text>
    <text x="340" y="199">Cleaning</text>
    <text x="560" y="199">Model</text>
    <text x="780" y="199">Insights</text>
  </g>

  <!-- connectors with flowing dots -->
  <g stroke="#30363d" stroke-width="2" stroke-dasharray="4 4">
    <line x1="190" y1="152" x2="270" y2="152"/><line x1="410" y1="152" x2="490" y2="152"/><line x1="630" y1="152" x2="710" y2="152"/>
  </g>
  <g fill="#58a6ff">
    <circle cx="190" cy="152" r="4"><animateMotion path="M0,0 H80" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="152" r="4"><animateMotion path="M0,0 H80" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="152" r="4"><animateMotion path="M0,0 H80" dur="1.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="152" r="4"><animateMotion path="M0,0 H80" dur="1.6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="630" cy="152" r="4"><animateMotion path="M0,0 H80" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="630" cy="152" r="4"><animateMotion path="M0,0 H80" dur="1.6s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
